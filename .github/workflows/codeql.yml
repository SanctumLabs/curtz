# reference https://github.com/github/codeql-action
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # At 06:00 on Monday.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  CodeQL-Build:
    # CodeQL runs on ubuntu-latest, windows-latest, and macos-latest
    runs-on: ubuntu-latest

    permissions:
      # required for all workflows
      security-events: write

      # only required for workflows in private repositories
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # go.mod needs Go 1.26, and Autobuild uses the Go on the runner.
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: go

      # Autobuild attempts to build any compiled languages. If it fails, replace it with an explicit build step.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
