name: Sentry Release

on:
  workflow_run:
    workflows:
      - "Build"
    types:
      - completed
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  sentryrelease:
    name: Sentry Release

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Install Dependencies
      run: make install

    - name: Run Build
      run: make build

    - name: Create Sentry Staging release
      if: github.event.workflow_run.head_branch == 'develop'
      uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_GH_RELEASE_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      with:
        environment: staging

    - name: Create Sentry Production release
      if: github.event.workflow_run.head_branch == 'main'
      uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_GH_RELEASE_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      with:
        environment: production
