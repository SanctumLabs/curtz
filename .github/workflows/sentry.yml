name: Sentry Release

on:
  workflow_run:
    workflows:
      - "Build"
    types:
      - completed
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  sentryrelease:
    name: Sentry Release

    runs-on: ubuntu-latest

    # Runs only when the Build workflow concluded successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod

    - name: Install Dependencies
      run: make install

    - name: Run Build
      run: make build

    - name: Create Sentry Staging release
      if: github.event.workflow_run.head_branch == 'develop'
      uses: getsentry/action-release@v3.7.0
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_GH_RELEASE_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      with:
        environment: staging

    - name: Create Sentry Production release
      if: github.event.workflow_run.head_branch == 'main'
      uses: getsentry/action-release@v3.7.0
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_GH_RELEASE_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      with:
        environment: production
