output {
  elasticsearch {
    hosts => ["http://es-1:9200", "http://es-2:9200", "http://es-3:9200"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "curtz"
    data_stream_namespace => "default"
  }
}
